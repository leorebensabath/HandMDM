defaults:
  - text_encoder: clip
  - motion_loader: bobsl_lmdb
  - defaults
  - _self_

data:
  _target_: src.data.text_motion.TextMotionDataset
  name: ${dataset}
  split: train
  min_seconds: 0.0
  max_seconds: 3.0
  preload: false
  tiny: false
  # dropping data
  drop_cond: null

dataset: bobsl3dt

motion_dataset: bobsl3dt
motion_normalizer:
  _target_: src.normalizer.Normalizer
  base_dir: motion_stats/${motion_dataset}
  eps: 1e-12
  disable: True